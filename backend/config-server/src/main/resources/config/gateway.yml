# Rutas del API Gateway
#
# El gateway es la unica puerta de entrada publica. Solo enruta y autoriza:
# NO tiene usuarios ni emite tokens, eso es trabajo del servicio auth.
#
# Las rutas viven aqui y no en el codigo para poder anadir un microservicio
# (por ejemplo pagos) sin recompilar el gateway. Por eso se usa lb://, que
# resuelve el destino con el registro de Eureka.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # El servicio auth va el primero: el login tiene que funcionar
            # antes de que exista ninguna cookie.
            - id: auth
              uri: lb://auth
              predicates:
                - Path=/auth/**
            - id: alumnos
              uri: lb://alumnos
              predicates:
                - Path=/api/alumnos/**
            - id: administracion
              uri: lb://administracion
              predicates:
                - Path=/api/administracion/**
