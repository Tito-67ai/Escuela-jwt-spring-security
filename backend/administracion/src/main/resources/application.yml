# Microservicio de administracion
#
# Guarda lo que es propio del servicio: puerto, base de datos y cola de
# mensajes. El secreto JWT y la cuenta de monitoreo NO estan aqui: los lee del
# Config Server, que es la unica fuente de verdad.
server:
  port: 8102

spring:
  application:
    name: administracion
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:file:./data/administracion
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

springdoc:
  api-docs:
    path: /api/administracion/v3/api-docs
  swagger-ui:
    # Solo se cambia la raiz: el HTML, los assets y el JSON quedan colgando de
    # /api/administracion/**, la unica ruta que el gateway tiene mapeada, y asi el navegador
    # puede seguir redirecciones y pedir ficheros hermanos.
    path: /api/administracion/swagger-ui.html
    doc-expansion: none
    display-request-duration: true
    try-it-out-enabled: true
  # No se fija swagger-css-url porque springdoc 3.x elimino esa propiedad: el
  # tema del proyecto no se puede inyectar en el HTML que genera springdoc. Por
  # eso la entrada a la documentacion es una pagina propia, que reutiliza los
  # assets de aqui y carga el CSS. Ojo: el fichero se llama index.html pero hay
  # que abrirlo con su nombre, porque /api/administracion/docs/ daria 404 (Spring
  # Boot solo resuelve index.html en la raiz) y /api/administracion/docs lo
  # absorbe el @GetMapping("/{id}") del controller.
  #   http://localhost:8080/api/administracion/docs/index.html

---
# Arranque local: el Config Server corre en la maquina.
spring:
  config:
    activate:
      on-profile: dev
    import: "optional:configserver:http://localhost:8888"

---
# Arranque con Docker Compose: los servicios se llaman por su nombre de servicio.
spring:
  config:
    activate:
      on-profile: docker
    import: "optional:configserver:http://configserver:8888"