# API Gateway
#
# Unica puerta de entrada publica. Solo guarda su puerto y su nombre: las rutas
# viven en el Config Server (config/gateway.yml) para poder cambiarlas sin
# recompilar, y el secreto JWT llega desde ahi.
server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    default: dev

---
# Arranque local: el Config Server corre en la maquina.
spring:
  config:
    activate:
      on-profile: dev
    import: "optional:configserver:http://localhost:8888"

---
# Arranque con Docker Compose: los servicios se llaman por su nombre de servicio.
spring:
  config:
    activate:
      on-profile: docker
    import: "optional:configserver:http://configserver:8888"
